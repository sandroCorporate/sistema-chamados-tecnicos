<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LL TECH INFO - Sistema de Chamados Técnicos</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }

      body {
        background-color: #f1f5f9;
        color: #334155;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
      }

      .container {
        background: #ffffff;
        width: 100%;
        max-width: 550px;
        padding: 24px;
        border-radius: 8px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      }

      /* CABEÇALHO CORPORATIVO 5S - LL TECH INFO */
      .app-header {
        display: flex;
        align-items: center;
        gap: 15px;
        background: #1e232a;
        color: #ffffff;
        padding: 15px 20px;
        border-radius: 6px;
        margin-bottom: 20px;
        border-bottom: 4px solid #0056b3;
      }

      .app-header img {
        height: 48px;
        width: auto;
        object-fit: contain;
      }

      .app-header h1 {
        font-size: 1.25rem;
        font-weight: 700;
        color: #ffffff;
        margin: 0;
        letter-spacing: 0.5px;
      }

      .app-header small {
        color: #cbd5e0;
        font-size: 0.8rem;
      }

      h2, h3, h4 {
        color: #1e293b;
        margin-bottom: 16px;
      }

      .form-group {
        margin-bottom: 14px;
      }

      label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 5px;
        color: #475569;
      }

      input, textarea, select {
        width: 100%;
        padding: 10px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        font-size: 14px;
        outline: none;
      }

      input:focus, textarea:focus, select:focus {
        border-color: #2563eb;
      }

      button {
        width: 100%;
        background-color: #2563eb;
        color: white;
        border: none;
        padding: 10px;
        border-radius: 6px;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.2s;
      }

      button:hover {
        background-color: #1d4ed8;
      }

      .btn-danger {
        background-color: #ef4444;
      }
      .btn-danger:hover {
        background-color: #dc2626;
      }

      .card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 6px;
        padding: 14px;
        margin-bottom: 12px;
      }

      .badge {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 12px;
        font-size: 11px;
        font-weight: 700;
      }

      .badge-ABERTO { background-color: #fef3c7; color: #d97706; }
      .badge-AGUARDANDO_PAGAMENTO, .badge-AGUARDANDO\ PAGAMENTO { background-color: #ffedd5; color: #c2410c; }
      .badge-EM_ATENDIMENTO, .badge-EM\ ATENDIMENTO { background-color: #dbeafe; color: #2563eb; }
      .badge-CONCLUIDO { background-color: #dcfce7; color: #16a34a; }

      .hidden { display: none !important; }

      .header-user {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
        border-bottom: 1px solid #e2e8f0;
        padding-bottom: 12px;
      }

      .msg {
        padding: 10px;
        border-radius: 6px;
        font-size: 13px;
        margin-top: 10px;
      }
      .msg-error { background-color: #fee2e2; color: #991b1b; }
      .msg-success { background-color: #dcfce7; color: #166534; }
      .pix-box { background: #fff; border: 1px dashed #f97316; padding: 10px; border-radius: 6px; margin-top: 10px; text-align: center; }

      .tab-auth {
        display: flex;
        gap: 10px;
        margin-bottom: 15px;
      }
      .tab-auth button {
        background: #e2e8f0;
        color: #475569;
      }
      .tab-auth button.active {
        background: #2563eb;
        color: white;
      }

      @media (max-width: 480px) {
        body { padding: 8px; align-items: flex-start; }
        .container { padding: 16px; border-radius: 0; box-shadow: none; min-height: 100vh; }
        input, textarea, select, button { font-size: 16px; padding: 12px; }
        .header-user { flex-direction: column; align-items: flex-start; gap: 10px; }
        .header-user button { align-self: flex-end; width: auto; }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- Cabeçalho Institucional LL TECH INFO -->
      <div class="app-header">
        <img src="/logo.png" alt="LL TECH INFO" />
        <div>
          <h1>LL TECH INFO</h1>
          <small>Soluções em Informática & Suporte Técnico</small>
        </div>
      </div>

      <!-- Tela de Acesso (Login / Registo) -->
      <div id="screen-login">
        <div class="tab-auth">
          <button type="button" id="btn-tab-login" class="active" onclick="alternarAba('login')">Entrar</button>
          <button type="button" id="btn-tab-registro" onclick="alternarAba('registro')">Criar Conta</button>
        </div>

        <!-- Formulário de Login -->
        <div id="box-login">
          <h2>Entrar no Sistema</h2>
          <div id="login-msg"></div>
          <form id="form-login" style="margin-top: 15px">
            <div class="form-group">
              <label>E-mail</label>
              <input type="email" id="login-email" required placeholder="seu.email@exemplo.com" />
            </div>
            <div class="form-group">
              <label>Senha</label>
              <input type="password" id="login-senha" required placeholder="••••••••" />
            </div>
            <button type="submit">Entrar</button>
          </form>
        </div>

        <!-- Formulário de Registo de Cliente -->
        <div id="box-registro" class="hidden">
          <h2>Registo de Novo Cliente</h2>
          <div id="reg-msg"></div>
          <form id="form-registro" style="margin-top: 15px">
            <div class="form-group">
              <label>Nome Completo</label>
              <input type="text" id="reg-nome" required placeholder="Nome Completo" />
            </div>
            <div class="form-group">
              <label>E-mail</label>
              <input type="email" id="reg-email" required placeholder="seu.email@exemplo.com" />
            </div>
            <div class="form-group">
              <label>WhatsApp (com DDD)</label>
              <input type="text" id="reg-telefone" required placeholder="92991112233" />
            </div>
            <div class="form-group">
              <label>CPF ou CNPJ</label>
              <input type="text" id="reg-documento" required placeholder="000.000.000-00" />
            </div>
            <div class="form-group">
              <label>Senha</label>
              <input type="password" id="reg-senha" required placeholder="••••••••" />
            </div>
            <button type="submit" style="background-color: #10b981;">Concluir Registo</button>
          </form>
        </div>
      </div>

      <!-- Painel Principal (Dashboard) -->
      <div id="screen-dashboard" class="hidden">
        <div class="header-user">
          <div>
            <h3 style="margin: 0">Painel de Atendimento</h3>
            <small id="user-info" style="color: #64748b"></small>
          </div>
          <button id="btn-logout" class="btn-danger" style="width: auto; padding: 6px 12px">Sair</button>
        </div>

        <!-- Formulário de Abrir Chamado (Apenas CLIENTE) -->
        <div id="section-novo-chamado" class="card" style="margin-bottom: 20px">
          <h4 style="margin-bottom: 10px">Abrir Novo Chamado</h4>
          <div id="chamado-msg"></div>
          <form id="form-chamado">
            <div class="form-group">
              <label>Título</label>
              <input type="text" id="chamado-titulo" required placeholder="Ex: Substituição de Disco Rígido" />
            </div>
            <div class="form-group">
              <label>Descrição</label>
              <textarea id="chamado-descricao" rows="3" required placeholder="Descreva detalhadamente o problema..."></textarea>
            </div>
            <button type="submit">Enviar Chamado</button>
          </form>
        </div>

        <h3>Chamados Registados</h3>
        <div id="lista-chamados">
          <p style="color: #64748b">Carregando...</p>
        </div>
      </div>
    </div>

    <script>
      let token = localStorage.getItem('token');
      let usuario = JSON.parse(localStorage.getItem('usuario') || 'null');

      const screenLogin = document.getElementById('screen-login');
      const screenDashboard = document.getElementById('screen-dashboard');
      const loginMsg = document.getElementById('login-msg');
      const regMsg = document.getElementById('reg-msg');
      const chamadoMsg = document.getElementById('chamado-msg');

      if (token && usuario) {
        showDashboard();
      } else {
        showLogin();
      }

      function showLogin() {
        screenLogin.classList.remove('hidden');
        screenDashboard.classList.add('hidden');
      }

      function alternarAba(aba) {
        if (aba === 'login') {
          document.getElementById('box-login').classList.remove('hidden');
          document.getElementById('box-registro').classList.add('hidden');
          document.getElementById('btn-tab-login').classList.add('active');
          document.getElementById('btn-tab-registro').classList.remove('active');
        } else {
          document.getElementById('box-login').classList.add('hidden');
          document.getElementById('box-registro').classList.remove('hidden');
          document.getElementById('btn-tab-login').classList.remove('active');
          document.getElementById('btn-tab-registro').classList.add('active');
        }
      }

      function showDashboard() {
        screenLogin.classList.add('hidden');
        screenDashboard.classList.remove('hidden');
        document.getElementById('user-info').innerText = usuario.nome + ' (' + usuario.tipo + ') - ' + usuario.email;

        if (usuario.tipo === 'CLIENTE' || usuario.tipo === 'cliente') {
          document.getElementById('section-novo-chamado').classList.remove('hidden');
        } else {
          document.getElementById('section-novo-chamado').classList.add('hidden');
        }

        carregarChamados();
      }

      // Login
      document.getElementById('form-login').addEventListener('submit', async (e) => {
        e.preventDefault();
        loginMsg.innerHTML = '';
        const email = document.getElementById('login-email').value;
        const senha = document.getElementById('login-senha').value;

        try {
          const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, senha }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Erro ao realizar login.');

          token = data.token;
          usuario = data.usuario;
          localStorage.setItem('token', token);
          localStorage.setItem('usuario', JSON.stringify(usuario));
          showDashboard();
        } catch (err) {
          loginMsg.innerHTML = '<div class="msg msg-error">' + err.message + '</div>';
        }
      });

      // Registo Público
      document.getElementById('form-registro').addEventListener('submit', async (e) => {
        e.preventDefault();
        regMsg.innerHTML = '';

        const nome = document.getElementById('reg-nome').value;
        const email = document.getElementById('reg-email').value;
        const telefone = document.getElementById('reg-telefone').value;
        const documento = document.getElementById('reg-documento').value;
        const senha = document.getElementById('reg-senha').value;

        try {
          const res = await fetch('/api/registro', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ nome, email, telefone, documento, senha }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Erro no registo.');

          regMsg.innerHTML = '<div class="msg msg-success">Conta criada com sucesso! Faça login para continuar.</div>';
          document.getElementById('form-registro').reset();
          setTimeout(() => alternarAba('login'), 2000);
        } catch (err) {
          regMsg.innerHTML = '<div class="msg msg-error">' + err.message + '</div>';
        }
      });

      // Criar Chamado
      document.getElementById('form-chamado').addEventListener('submit', async (e) => {
        e.preventDefault();
        chamadoMsg.innerHTML = '';
        const titulo = document.getElementById('chamado-titulo').value;
        const descricao = document.getElementById('chamado-descricao').value;

        try {
          const res = await fetch('/api/chamados', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
            body: JSON.stringify({ titulo, descricao }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Erro ao criar chamado.');

          document.getElementById('chamado-titulo').value = '';
          document.getElementById('chamado-descricao').value = '';
          chamadoMsg.innerHTML = '<div class="msg msg-success">Chamado aberto com sucesso!</div>';
          carregarChamados();
        } catch (err) {
          chamadoMsg.innerHTML = '<div class="msg msg-error">' + err.message + '</div>';
        }
      });

      async function carregarChamados() {
        const listaDiv = document.getElementById('lista-chamados');
        try {
          const res = await fetch('/api/chamados', {
            headers: { Authorization: 'Bearer ' + token },
          });
          const chamados = await res.json();
          if (!res.ok) throw new Error(chamados.error || 'Erro ao buscar chamados.');

          if (chamados.length === 0) {
            listaDiv.innerHTML = '<p style="color: #64748b;">Nenhum chamado encontrado.</p>';
            return;
          }

          let htmlContent = '';
          for (let i = 0; i < chamados.length; i++) {
            const c = chamados[i];
            const statusClass = c.status ? c.status.replace(/\s+/g, '_') : 'ABERTO';
            const valorNum = c.valor ? Number(c.valor) : 0;
            const dataCriacao = new Date(c.criado_em).toLocaleString('pt-BR');
            const isCliente = usuario.tipo === 'CLIENTE' || usuario.tipo === 'cliente';

            htmlContent += '<div class="card" id="card-' + c.id + '">';
            htmlContent += '<div style="display: flex; justify-content: space-between; align-items: start;">';
            htmlContent += '<h4 id="titulo-' + c.id + '">' + c.titulo + '</h4>';
            htmlContent += '<span class="badge badge-' + statusClass + '">' + c.status + '</span>';
            htmlContent += '</div>';
            htmlContent += '<p id="desc-' + c.id + '" style="margin-top: 8px; color: #475569;">' + c.descricao + '</p>';
            htmlContent += '<small style="color: #94a3b8; display: block; margin-top: 8px;">Criado em: ' + dataCriacao + '</small>';

            if (valorNum > 0) {
              htmlContent += '<small style="color: #0284c7; display: block; font-weight: bold; margin-top: 4px;">Valor: R$ ' + valorNum.toFixed(2) + '</small>';
            }

            htmlContent += '<div id="pix-container-' + c.id + '" class="pix-box hidden">';
            htmlContent += '<p style="font-size: 12px; font-weight: bold; color: #c2410c; margin-bottom: 5px;">Escaneie o QR Code ou copie o Pix:</p>';
            htmlContent += '<img id="pix-img-' + c.id + '" src="" alt="QR Code Pix" style="max-width: 150px; display: block; margin: 0 auto 8px auto;" />';
            htmlContent += '<textarea id="pix-copia-' + c.id + '" rows="2" style="font-size: 11px; resize: none;" readonly></textarea>';
            htmlContent += '<button type="button" onclick="window.copiarPix(\'' + c.id + '\')" style="margin-top: 6px; background-color: #f97316; font-size: 12px; padding: 6px;">Copiar Código Pix</button>';
            htmlContent += '</div>';

            if (isCliente && c.status === 'ABERTO') {
              htmlContent += '<div style="margin-top: 10px; border-top: 1px solid #cbd5e1; padding-top: 8px; display: flex; gap: 5px;">';
              htmlContent += '<button type="button" class="btn-toggle-edicao" data-id="' + c.id + '" style="background-color: #f59e0b; width: auto; padding: 5px 12px; font-size: 12px; color: white; border: none; border-radius: 6px; cursor: pointer;">Editar</button>';
              htmlContent += '</div>';
              htmlContent += '<form id="form-edit-' + c.id + '" class="hidden" style="margin-top: 10px;" onsubmit="window.salvarEdicao(event, \'' + c.id + '\')">';
              htmlContent += '<input type="text" id="input-edit-titulo-' + c.id + '" value="' + c.titulo.replace(/"/g, '&quot;') + '" style="margin-bottom: 5px;" required>';
              htmlContent += '<textarea id="input-edit-desc-' + c.id + '" rows="2" style="margin-bottom: 5px;" required>' + c.descricao + '</textarea>';
              htmlContent += '<div style="display: flex; gap: 5px;">';
              htmlContent += '<button type="submit" style="background-color: #10b981; width: auto; padding: 5px 12px; font-size: 12px;">Guardar</button>';
              htmlContent += '<button type="button" class="btn-toggle-edicao" data-id="' + c.id + '" style="background-color: #64748b; width: auto; padding: 5px 12px; font-size: 12px;">Cancelar</button>';
              htmlContent += '</div>';
              htmlContent += '</form>';
            }

            if (isCliente && (c.status === 'AGUARDANDO_PAGAMENTO' || c.status === 'AGUARDANDO PAGAMENTO') && !c.pagamento_id) {
              htmlContent += '<div style="margin-top: 10px; border-top: 1px solid #cbd5e1; padding-top: 8px;">';
              htmlContent += '<button type="button" onclick="window.gerarPix(\'' + c.id + '\',' + (c.valor || 0.03) + ')" style="background-color: #f97316; font-size: 12px; padding: 8px;">Pagar com Pix</button>';
              htmlContent += '</div>';
            }

            if (!isCliente) {
              const selAberto = c.status === 'ABERTO' ? 'selected' : '';
              const selAguardando = (c.status === 'AGUARDANDO PAGAMENTO' || c.status === 'AGUARDANDO_PAGAMENTO') ? 'selected' : '';
              const selEmAtendimento = (c.status === 'EM ATENDIMENTO' || c.status === 'EM_ATENDIMENTO') ? 'selected' : '';
              const selConcluido = c.status === 'CONCLUIDO' ? 'selected' : '';

              htmlContent += '<div style="margin-top: 10px; border-top: 1px solid #cbd5e1; padding-top: 8px;">';
              htmlContent += '<div style="display: flex; gap: 8px; align-items: flex-end; margin-bottom: 6px;">';
              htmlContent += '<div style="flex: 1;">';
              htmlContent += '<label style="font-size: 12px;">Status:</label>';
              htmlContent += '<select id="select-status-' + c.id + '" style="margin-top: 4px;">';
              htmlContent += '<option value="ABERTO" ' + selAberto + '>ABERTO</option>';
              htmlContent += '<option value="AGUARDANDO PAGAMENTO" ' + selAguardando + '>AGUARDANDO PAGAMENTO</option>';
              htmlContent += '<option value="EM ATENDIMENTO" ' + selEmAtendimento + '>EM ATENDIMENTO</option>';
              htmlContent += '<option value="CONCLUIDO" ' + selConcluido + '>CONCLUIDO</option>';
              htmlContent += '</select>';
              htmlContent += '</div>';
              htmlContent += '<div style="width: 90px;">';
              htmlContent += '<label style="font-size: 12px;">Valor (R$):</label>';
              htmlContent += '<input type="number" step="0.01" id="input-val-' + c.id + '" value="' + (c.valor || '0.03') + '" style="margin-top: 4px; padding: 8px;" />';
              htmlContent += '</div>';
              htmlContent += '</div>';
              htmlContent += '<button type="button" onclick="window.salvarDadosTecnico(\'' + c.id + '\')" style="background-color: #10b981; font-size: 12px; padding: 6px;">Guardar Alterações</button>';
              htmlContent += '</div>';
            }

            htmlContent += '</div>';
          }
          listaDiv.innerHTML = htmlContent;
        } catch (err) {
          listaDiv.innerHTML = '<div class="msg msg-error">' + err.message + '</div>';
        }
      }

      document.body.addEventListener('click', function (e) {
        const targetBtn = e.target.closest('.btn-toggle-edicao');
        if (targetBtn) {
          e.preventDefault();
          const id = targetBtn.getAttribute('data-id');
          const form = document.getElementById('form-edit-' + id);
          if (form) {
            form.classList.toggle('hidden');
          }
        }
      });

      window.salvarDadosTecnico = async function(id) {
        const selectEl = document.getElementById('select-status-' + id);
        const inputEl = document.getElementById('input-val-' + id);
        
        if (!selectEl || !inputEl) {
          alert('Erro: Elementos do formulário não encontrados.');
          return;
        }

        const novoStatus = selectEl.value;
        const novoValor = parseFloat(inputEl.value) || 0.03;

        try {
          const res = await fetch('/api/chamados/' + id, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
            body: JSON.stringify({ status: novoStatus, valor: novoValor }),
          });

          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Erro ao atualizar chamado.');

          alert('Alterações salvas com sucesso!');
          carregarChamados();
        } catch (err) {
          alert('Erro ao guardar: ' + err.message);
        }
      };

      window.gerarPix = async function (id, valorPadrao) {
        const valorInput = prompt('Confirme o valor do atendimento para pagamento Pix (R$):', valorPadrao);
        if (!valorInput) return;

        try {
          const res = await fetch('/api/chamados/' + id + '/pagar-pix', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
            body: JSON.stringify({ valor: parseFloat(valorInput) }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Erro ao gerar Pix.');

          document.getElementById('pix-img-' + id).src = 'data:image/png;base64,' + data.qrCodeBase64;
          document.getElementById('pix-copia-' + id).value = data.qrCode;
          document.getElementById('pix-container-' + id).classList.remove('hidden');
          alert('Cobrança Pix gerada com sucesso!');
        } catch (err) {
          alert(err.message);
        }
      };

      window.copiarPix = function (id) {
        const textarea = document.getElementById('pix-copia-' + id);
        textarea.select();
        document.execCommand('copy');
        alert('Código Pix copiado para a área de transferência!');
      };

      window.salvarEdicao = async function (event, id) {
        event.preventDefault();
        const inputTitulo = document.getElementById('input-edit-titulo-' + id);
        const inputDesc = document.getElementById('input-edit-desc-' id);

        try {
          const res = await fetch('/api/chamados/' + id + '/editar', {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
            body: JSON.stringify({ titulo: inputTitulo.value, descricao: inputDesc.value }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Erro ao guardar alterações.');

          carregarChamados();
          alert('Chamado atualizado com sucesso!');
        } catch (err) {
          alert('Erro ao salvar: ' + err.message);
        }
      };

      document.getElementById('btn-logout').addEventListener('click', () => {
        localStorage.removeItem('token');
        localStorage.removeItem('usuario');
        token = null;
        usuario = null;
        showLogin();
      });
    </script>
  </body>
</html>
